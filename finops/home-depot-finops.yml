specification: FinOps Framework
specificationVersion: '1.0'
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
provider: home-depot
providerId: home-depot
publisherName: The Home Depot, Inc.
serviceCategory: Retail / E-Commerce
created: '2026-05-04'
modified: '2026-05-05'
reconciled: false
tags:
  - Retail
  - E-Commerce
  - Home Improvement
  - Supplier
  - FinOps
  - FOCUS
notes: The Home Depot does not bill suppliers or partners for API calls in a usage-meter shape; cost flows
  through partner-program fees, advertising spend, vendor agreements, and Pro-Xtra economics. Meters below
  capture the right shape for a supplier integration; pricing is bilateral.
description: 'FOCUS-aligned FinOps stub for Home Depot. Partner-program / supplier-agreement economics
  rather than public API billing.'
sources:
  - https://corporate.homedepot.com/
  - https://supplierhub.homedepot.com/
billingModel:
  pricingCategory: Partner Program / Supplier Agreement
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
    - Purchase
    - Usage
    - Adjustment
    - Refund
focusColumns:
  ServiceName: Home Depot
  ServiceCategory: Retail / E-Commerce
  ProviderName: The Home Depot, Inc.
  PublisherName: The Home Depot, Inc.
  InvoiceIssuerName: The Home Depot, Inc.
  PricingCategory: Bilateral
  PricingUnit: varies
  BillingCurrency: USD
  ChargeCategory: Usage
principles:
  - name: Visibility
    description: Reconcile orders, returns, and ad-spend events through Supplier Hub reports and the
      consuming ERP / advertising platform.
  - name: Allocation
    description: Allocate fees by program (Supplier Hub catalog, OneSource ads, Pro Xtra B2B) and by
      department / SKU within your own organization.
  - name: Optimization
    description: Cost levers are negotiation of vendor terms, advertising bid optimization, and improving
      content / data quality to reduce Supplier-Hub penalty fees.
  - name: Accountability
    description: Vendor-management owns the Home Depot relationship; e-commerce / advertising teams own
      the operational programs.
domains:
  - name: Understand Usage and Cost
    capabilities:
      - Allocation
      - Reporting and Analytics
      - Anomaly Management
  - name: Quantify Business Value
    capabilities:
      - Planning and Estimating
      - Forecasting
      - Budgeting
      - Unit Economics
  - name: Optimize Usage and Cost
    capabilities:
      - Rate Optimization
      - Workload Optimization
      - Licensing and SaaS
  - name: Manage the FinOps Practice
    capabilities:
      - Invoicing and Chargeback
      - Onboarding Workloads
      - Intersecting Disciplines
meters:
  - name: orders
    description: Orders placed against the supplier through Home Depot channels
    unit: order
    aggregation: sum
    dimensions:
      - partner_id
      - sku
      - channel
      - market
  - name: gmv
    description: Gross merchandise value of orders
    unit: USD
    aggregation: sum
    dimensions:
      - partner_id
      - sku
  - name: ad_spend
    description: Advertising / OneSource spend on Home Depot platforms
    unit: USD
    aggregation: sum
    dimensions:
      - partner_id
      - campaign
  - name: returns
    description: Return events
    unit: event
    aggregation: sum
    dimensions:
      - partner_id
      - sku
apis:
  - name: Home Depot API
    baseURL: https://api.homedepot.com
    tags:
      - Retail
      - E-Commerce
      - Supplier
    serviceName: Home Depot API
    serviceCategory: Retail / E-Commerce
unitEconomics:
  - name: Effective Take Rate
    metric: home_depot_fees / gmv
    target: per partner agreement
  - name: Cost per Order
    metric: home_depot_fees / orders
    target: per partner agreement
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
